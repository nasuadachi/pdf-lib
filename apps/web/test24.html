<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' 'unsafe-inline' data: resource:;
        object-src 'none';
        frame-src 'none';
      "
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" type="text/css" href="/apps/web/index.css" />
    <title>Test 24</title>
    <script type="text/javascript" src="/dist/pdf-lib.js"></script>
    <script type="text/javascript" src="/apps/web/utils.js"></script>
  </head>

  <body>
    <div id="button-container">
      <button onclick="window.location.href = '/apps/web/test23.html'">
        Prev
      </button>
      <button onclick="runStressTest(30)">Run 30</button>
      <button onclick="runStressTest(100)">Run 100</button>
      <button onclick="stopStressTest()">Stop</button>
      <button onclick="openLatestPdf()">Open Latest</button>
      <button onclick="downloadLatestPdf()">Download Latest</button>
      <button disabled>Next</button>
      <button id="status" disabled>Idle</button>
    </div>
    <div id="animation-target"></div>
    <div
      id="server-preview-panel"
      style="
        width: min(720px, calc(100vw - 32px));
        margin: 16px;
        font-family: sans-serif;
      "
    >
      <div
        id="progress-bar"
        style="height: 10px; width: 0%; background: #2b6cb0;"
      ></div>
      <pre id="preview-log" style="white-space: pre-wrap;">Idle</pre>
    </div>
  </body>

  <script type="text/javascript">
    startFpsTracker('animation-target');

    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    let shouldStopStressTest = false;
    let stressTestRunId = 0;
    const latestPdfPreview = createServerBackedPdfPreview({
      clearBytesAfterUse: true,
    });

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const setStatus = (message) => {
      document.getElementById('status').textContent = message;
    };

    const getMemoryStatus = () => {
      if (!performance.memory) return '';

      const usedMb = performance.memory.usedJSHeapSize / 1024 / 1024;
      return ` / ${usedMb.toFixed(1)} MB`;
    };

    const setProgress = (iteration, iterations, pdfBytes) => {
      const percent = iterations === 0 ? 0 : (iteration / iterations) * 100;
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('preview-log').textContent = [
        `${iterations}回テスト ${iteration}回目`,
        `generated bytes: ${pdfBytes ? pdfBytes.length : 0}`,
        `iframe: none`,
        `object URL during run: none`,
        `server URL during run: none`,
        `latest PDF retained: ${latestPdfPreview.hasBytes() ? 'yes' : 'no'}`,
        `latest server URL: ${latestPdfPreview.getLatestUrl() || 'none'}`,
      ].join('\n');
    };

    const setCompletedStatus = (iterations, iteration, suffix = '') => {
      const message = `${iterations}回テスト ${iteration}回目 完了した${suffix}${getMemoryStatus()}`;
      console.log(message);
      setStatus(message);
    };

    const createPdfBytes = async (iteration) => {
      const pdfDoc = await PDFDocument.create({ updateMetadata: false });
      const page = pdfDoc.addPage([612, 792]);
      const font = await pdfDoc.embedFont(StandardFonts.Helvetica);

      page.drawText(`Server-backed deferred preview: ${iteration}`, {
        x: 48,
        y: 720,
        size: 24,
        font,
        color: rgb(0.1, 0.1, 0.1),
      });

      for (let idx = 0; idx < 40; idx++) {
        page.drawText(`Line ${idx + 1} / iteration ${iteration}`, {
          x: 48,
          y: 680 - idx * 14,
          size: 10,
          font,
          color: rgb((idx % 10) / 12, 0.25, 0.5),
        });
      }

      return pdfDoc.save({ dispose: true });
    };

    async function runStressTest(iterations) {
      const runId = ++stressTestRunId;
      shouldStopStressTest = false;
      latestPdfPreview.clear();
      setProgress(0, iterations, undefined);
      let completedIteration = 0;

      for (let iteration = 1; iteration <= iterations; iteration++) {
        if (shouldStopStressTest || runId !== stressTestRunId) break;

        setStatus(`Generating ${iteration}/${iterations}${getMemoryStatus()}`);

        const pdfBytes = await createPdfBytes(iteration);
        if (shouldStopStressTest || runId !== stressTestRunId) break;

        latestPdfPreview.setBytes(pdfBytes);
        completedIteration = iteration;
        setProgress(iteration, iterations, pdfBytes);
        setCompletedStatus(iterations, iteration);

        await sleep(120);
      }

      if (
        runId === stressTestRunId &&
        !shouldStopStressTest &&
        completedIteration === iterations
      ) {
        await sleep(250);
        setCompletedStatus(iterations, completedIteration, ' / メモリ解放済み');
      } else if (runId === stressTestRunId && shouldStopStressTest) {
        setStatus('Stopped');
      }
    }

    async function openLatestPdf() {
      if (!latestPdfPreview.hasBytes()) {
        setStatus('No PDF generated');
        return;
      }

      try {
        const result = await latestPdfPreview.open();
        setProgress(0, 0, undefined);
        setStatus(`Opened ${result.url} / bytes released${getMemoryStatus()}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function downloadLatestPdf() {
      if (!latestPdfPreview.hasBytes()) {
        setStatus('No PDF generated');
        return;
      }

      try {
        await latestPdfPreview.download('pdf-lib-test24.pdf');
        setProgress(0, 0, undefined);
        setStatus(`Downloaded latest PDF / bytes released${getMemoryStatus()}`);
      } catch (error) {
        setStatus(error.message);
      }
    }

    function stopStressTest() {
      shouldStopStressTest = true;
      stressTestRunId += 1;
      latestPdfPreview.clear();
      setProgress(0, 0, undefined);
      setStatus('Stopped');
    }
  </script>
</html>
